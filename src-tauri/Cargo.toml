[workspace]
members = ["."]

[package]
name = "bustermark"
version = "0.1.0"
description = "A writing workbench with AI integration"
authors = ["Luke Hightower"]
edition = "2021"

[lib]
name = "buster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["unstable", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# File explorer
ignore = "0.4"

# File watcher
notify = "6"

# Web search
reqwest = "0.12"

dirs = "6"

# URL parsing for web search endpoints
url = "2"

# Image support
base64 = "0.22"

# WGSL note backgrounds: validate WGSL and translate it to GLSL ES for WebGL2
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }

tempfile = "3"

# Process group signals for the Claude Code process (Unix only)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
