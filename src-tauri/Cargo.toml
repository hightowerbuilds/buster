[workspace]
members = [".", "crates/terminal-pro"]

[package]
name = "bustermark"
version = "0.1.0"
description = "A writing workbench with AI integration"
authors = ["Luke Hightower"]
edition = "2021"

[lib]
name = "buster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["unstable", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }

# Terminal
portable-pty = "0.9"
vt100 = "0.15"

# tree-sitter-markdown omitted — v0.7 doesn't bundle highlight queries
# tree-sitter-sql omitted — v0.0.2 doesn't bundle highlight queries

# File explorer
ignore = "0.4"

# File watcher
notify = "6"

# AI Agent
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

# Extension system
dirs = "6"

# Provider URL validation
url = "2"

# Large file support
memmap2 = "0.9"

# Image support
base64 = "0.22"

# Shell word parsing (security: replaces custom parser)

# Process group kill on terminal close (Unix only)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

# Buster supporting libraries
buster-terminal-pro = { path = "crates/terminal-pro" }

[dev-dependencies]
tempfile = "3"
